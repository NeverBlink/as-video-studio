# Cabeceras de proxy comunes. Lo que hay aqui no es decoracion:
#
# - X-Forwarded-Proto es lo que hace que el login sepa que la conexion venia por
#   HTTPS. Sin ella marca la cookie de sesion como insegura y el navegador la
#   tira: se entra bien y se vuelve a la pantalla de acceso, sin un solo error.
# - X-Real-IP / X-Forwarded-For son lo que ve el limitador de intentos. Sin
#   ellas todos los intentos parecen venir de 127.0.0.1 y el bloqueo por fuerza
#   bruta se aplicaria a todo el mundo a la vez.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_redirect off;
