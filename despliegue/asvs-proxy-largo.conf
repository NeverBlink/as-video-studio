# Como asvs-proxy.conf, pero para el estudio. Dos diferencias, y las dos hacen
# falta:
#
# - 3600 s de espera. Un render pasa de la hora; con los 60 s de fabrica nginx
#   corta la peticion a la mitad y la pantalla se queda mirando un vídeo que en
#   realidad se está generando.
# - `proxy_buffering off`. El progreso de una tanda se manda segun ocurre; con
#   el buffer puesto llega todo de golpe al final y la barra parece colgada.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_connect_timeout 10s;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
proxy_redirect off;
