# AS Video Studio — el sitio. Lo instala `instalar.sh` en
# /etc/nginx/sites-available/as-video-studio y sustituye __DOMINIO__.
#
# Certbot anade despues el bloque TLS y la redireccion de HTTP a HTTPS.
#
# COMO ESTA REPARTIDO: el estudio NO sabe lo que es un usuario, a proposito.
# Quien decide si pasas es el login (Node, :3000); nginx le pregunta en cada
# peticion con `auth_request` y, si dice que si, pasa la peticion al estudio
# (Python, :8110). Sin esta capa, cualquiera que sepa la direccion genera
# imagenes con TUS claves.

limit_req_zone $binary_remote_addr zone=asvs_login:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    access_log /var/log/nginx/as-video-studio.access.log;
    error_log  /var/log/nginx/as-video-studio.error.log;

    # Las referencias de estilo se suben desde la pantalla y son imagenes
    # grandes; con el defecto (1 MB) la subida falla con un 413 sin explicar.
    client_max_body_size 2g;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;
    # Sin esta linea nginx comprime al nivel 1, que es el defecto y casi no
    # comprime. El 5 es donde deja de salir a cuenta subir mas.
    gzip_comp_level 5;
    # Comprimir tambien lo que viene del proxy: las respuestas del estudio las
    # sirve uvicorn por detras, no el disco, y sin `any` el JSON iria en claro.
    gzip_proxied any;
    gzip_vary on;

    # ---- El acceso: lo sirve Node ----

    # Primera barrera de fuerza bruta, antes incluso de llegar a Node.
    location = /api/login {
        limit_req zone=asvs_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/asvs-proxy.conf;
    }

    location = /login    { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/asvs-proxy.conf; }
    location = /api/csrf   { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/asvs-proxy.conf; }
    location = /api/logout { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/asvs-proxy.conf; }
    location = /api/me     { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/asvs-proxy.conf; }
    location = /api/health { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/asvs-proxy.conf; }

    # Los assets del login. El estudio sirve los suyos en la raiz
    # (`estilo.css`, `app.js`), asi que no se pisan.
    location /css/    { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/asvs-proxy.conf; }
    location /js/     { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/asvs-proxy.conf; }
    location /assets/ { proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/asvs-proxy.conf; }

    # ---- Quien esta dentro ----
    # No lo llama ningun navegador: lo llama nginx en cada peticion.
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include /etc/nginx/snippets/asvs-proxy.conf;
    }

    # ---- Todo lo demas ES el estudio ----
    location / {
        auth_request /_auth;
        error_page 401 403 = @al_login;
        proxy_pass http://127.0.0.1:8110;
        include /etc/nginx/snippets/asvs-proxy-largo.conf;
    }

    location @al_login { return 302 /login; }
}
